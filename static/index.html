<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Strike — Карта</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0a0a1a;
            color: #e0e0ff;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #2a2a4a;
        }

        h1 {
            color: #4a9eff;
            font-size: 2rem;
            margin-bottom: 6px;
        }

        .subtitle { color: #8888cc; font-size: 0.95rem; }

        .layout {
            display: flex;
            gap: 24px;
            max-width: 1600px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        .map-wrap {
            flex: 1;
            min-width: 900px;
        }

        .map-container {
            position: relative;
        }

        .map-container:fullscreen,
        .map-container:-webkit-full-screen {
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
        }

        .map-container:fullscreen .galaxy-map,
        .map-container:-webkit-full-screen .galaxy-map {
            flex: 1;
            width: 100%;
            height: 100%;
            min-height: 0;
            border-radius: 0;
            border: none;
        }

        .fullscreen-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 100;
            padding: 8px 14px;
            background: rgba(20, 25, 50, 0.85);
            border: 1px solid #4a9eff;
            border-radius: 8px;
            color: #4a9eff;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .fullscreen-btn:hover {
            background: rgba(74, 158, 255, 0.25);
            color: #fff;
        }

        .map-container:fullscreen .fullscreen-btn,
        .map-container:-webkit-full-screen .fullscreen-btn {
            top: 16px;
            right: 16px;
        }

        .galaxy-map {
            position: relative;
            width: 100%;
            height: 700px;
            background:
                radial-gradient(circle at center, rgba(10, 15, 30, 0.2) 0%, rgba(5, 10, 20, 0.95) 100%),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="50" cy="50" r="0.5" fill="white" opacity="0.15"/></svg>') repeat;
            border: 1px solid #2a2a5a;
            border-radius: 12px;
            overflow: hidden;
        }

        #d3-links { position: absolute; inset: 0; pointer-events: none; }
        #d3-links line { stroke-opacity: 0.35; stroke-width: 1.5; }

        .planet {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-8px, -8px);
            border: 2px solid rgba(255,255,255,0.7);
            box-shadow: 0 0 12px currentColor;
            z-index: 10;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .planet:hover, .planet.selected {
            transform: translate(-8px, -8px) scale(1.8);
            z-index: 50;
        }

        .planet.selected { border-color: #fff; box-shadow: 0 0 20px #fff, 0 0 30px currentColor; }

        .planet .label {
            position: absolute;
            left: 20px;
            top: -4px;
            white-space: nowrap;
            font-size: 11px;
            color: #ccd;
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 0 4px #000;
            transition: opacity 0.2s;
        }

        .planet:hover .label, .planet.selected .label { opacity: 1; }

        /* Огонь вокруг планеты */
        .planet.on-fire::before,
        .planet.on-fire::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .planet.on-fire::before {
            inset: -14px;
            background: radial-gradient(circle, rgba(255,120,0,0.7) 0%, rgba(255,50,0,0.3) 50%, transparent 70%);
            animation: fire-pulse 0.8s ease-in-out infinite alternate;
        }

        .planet.on-fire::after {
            inset: -22px;
            background: radial-gradient(circle, rgba(255,200,50,0.4) 0%, transparent 60%);
            animation: fire-pulse 1.2s ease-in-out infinite alternate-reverse;
        }

        @keyframes fire-pulse {
            from { transform: scale(0.9); opacity: 0.7; }
            to   { transform: scale(1.15); opacity: 1; }
        }

        .panel {
            width: 300px;
            flex-shrink: 0;
            background: rgba(20, 25, 50, 0.9);
            border: 1px solid #3a3a6a;
            border-radius: 12px;
            padding: 20px;
            align-self: flex-start;
        }

        .panel-empty { color: #6666aa; text-align: center; padding: 40px 10px; }

        .panel h2 { font-size: 1.4rem; margin-bottom: 4px; }
        .panel .owner { font-size: 0.9rem; margin-bottom: 20px; }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6666aa;
            margin-bottom: 10px;
        }

        .faction-btns { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }

        .faction-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 1px solid #3a3a6a;
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: #e0e0ff;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.15s, border-color 0.15s;
        }

        .faction-btn:hover { background: rgba(255,255,255,0.08); }
        .faction-btn.active { border-color: #4a9eff; background: rgba(74,158,255,0.15); }

        .faction-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .battle-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .battle-btn.off {
            background: rgba(60,60,100,0.5);
            color: #aaa;
            border: 1px solid #3a3a6a;
        }

        .battle-btn.on {
            background: linear-gradient(135deg, #ff6600, #ff2200);
            color: #fff;
            box-shadow: 0 0 20px rgba(255,80,0,0.5);
            animation: btn-glow 1s infinite alternate;
        }

        @keyframes btn-glow {
            from { box-shadow: 0 0 10px rgba(255,80,0,0.4); }
            to   { box-shadow: 0 0 25px rgba(255,80,0,0.8); }
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 16px;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #8888cc;
        }

        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    </style>
</head>
<body>
    <header>
        <h1>Alpha Strike</h1>
        <p class="subtitle">Клик по системе — сменить владельца или включить сражение</p>
    </header>

    <div class="layout">
        <div class="map-wrap">
            <div class="map-container" id="map-container">
                <button class="fullscreen-btn" id="fullscreen-btn" title="На весь экран">⛶ На весь экран</button>
                <div class="galaxy-map" id="galaxy-map">
                    <svg id="d3-links" width="100%" height="100%"></svg>
                </div>
            </div>
            <div class="legend" id="legend"></div>
        </div>

        <div class="panel" id="panel">
            <div class="panel-empty">Выберите систему на карте</div>
        </div>
    </div>

    <script>
        const ORIG_W = 1158, ORIG_H = 825;

        const FACTIONS = {
            davion:     { name: 'Дом Дэвион',                    color: '#cd7f32' },
            freeWorlds: { name: 'Содружество Свободных Миров',   color: '#800080' },
            stives:     { name: 'Сент-Ивское Объединение',       color: '#40e0d0' },
            capellan:   { name: 'Капелланская Конфедерация',     color: '#008000' },
        };

        let planets = [];
        let selected = null;

        function getMapSize() {
            const map = document.getElementById('galaxy-map');
            return { w: map.clientWidth, h: map.clientHeight };
        }

        function displayPos(origX, origY) {
            const { w, h } = getMapSize();
            return {
                x: Math.round(origX * (w / ORIG_W)),
                y: Math.round(origY * (h / ORIG_H)),
            };
        }

        function planetPos(planet) {
            return displayPos(planet.origX, planet.origY);
        }

        async function loadState() {
            const res = await fetch('/api/state');
            const data = await res.json();
            planets = (data.planets || []).map(p => ({
                name: p.name ?? p.Name,
                origX: p.x ?? p.X,
                origY: p.y ?? p.Y,
                faction: p.faction ?? p.Faction,
                factionColor: p.factionColor ?? p.FactionColor,
                factionName: p.factionName ?? p.FactionName,
                onFire: p.onFire ?? p.OnFire ?? false,
            }));
        }

        async function updatePlanet(name, changes) {
            const res = await fetch('/api/planet', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, ...changes }),
            });
            if (!res.ok) return null;
            const updated = await res.json();
            const idx = planets.findIndex(p => p.name === name);
            if (idx !== -1) {
                planets[idx].faction = updated.faction ?? updated.Faction;
                planets[idx].factionColor = updated.factionColor ?? updated.FactionColor;
                planets[idx].factionName = updated.factionName ?? updated.FactionName;
                planets[idx].onFire = updated.onFire ?? updated.OnFire;
            }
            return planets[idx];
        }

        function renderPlanets() {
            const map = document.getElementById('galaxy-map');
            map.querySelectorAll('.planet').forEach(el => el.remove());

            planets.forEach(planet => {
                const pos = planetPos(planet);
                const el = document.createElement('div');
                el.className = 'planet' +
                    (planet.onFire ? ' on-fire' : '') +
                    (selected?.name === planet.name ? ' selected' : '');
                el.style.left = pos.x + 'px';
                el.style.top = pos.y + 'px';
                el.style.color = planet.factionColor;

                const label = document.createElement('div');
                label.className = 'label';
                label.textContent = planet.name;
                el.appendChild(label);

                el.addEventListener('click', () => selectPlanet(planet.name));
                map.appendChild(el);
            });
        }

        function renderLinks() {
            const svg = d3.select('#d3-links');
            svg.selectAll('*').remove();

            const { w } = getMapSize();
            const maxDist = w * 0.12;
            const links = [];

            for (let i = 0; i < planets.length; i++) {
                for (let j = i + 1; j < planets.length; j++) {
                    const a = planets[i], b = planets[j];
                    if (a.faction !== b.faction) continue;
                    const pa = planetPos(a), pb = planetPos(b);
                    const dx = pa.x - pb.x, dy = pa.y - pb.y;
                    if (Math.sqrt(dx*dx + dy*dy) <= maxDist) {
                        links.push({ ax: pa.x, ay: pa.y, bx: pb.x, by: pb.y, color: a.factionColor });
                    }
                }
            }

            svg.selectAll('line')
                .data(links)
                .join('line')
                .attr('x1', d => d.ax)
                .attr('y1', d => d.ay)
                .attr('x2', d => d.bx)
                .attr('y2', d => d.by)
                .attr('stroke', d => d.color);
        }

        function isFullscreen() {
            return document.fullscreenElement === document.getElementById('map-container');
        }

        function updateFullscreenBtn() {
            const btn = document.getElementById('fullscreen-btn');
            if (!btn) return;
            btn.textContent = isFullscreen() ? '✕ Выйти' : '⛶ На весь экран';
        }

        async function toggleFullscreen() {
            const container = document.getElementById('map-container');
            if (isFullscreen()) {
                await document.exitFullscreen();
            } else {
                await container.requestFullscreen();
            }
        }

        function onMapResize() {
            renderPlanets();
            renderLinks();
        }

        function renderLegend() {
            document.getElementById('legend').innerHTML = Object.entries(FACTIONS).map(([id, f]) =>
                `<div class="legend-item">
                    <div class="legend-dot" style="background:${f.color}"></div>
                    ${f.name}
                </div>`
            ).join('');
        }

        function selectPlanet(name) {
            selected = planets.find(p => p.name === name);
            renderPlanets();
            renderPanel();
        }

        function renderPanel() {
            const panel = document.getElementById('panel');
            if (!selected) {
                panel.innerHTML = '<div class="panel-empty">Выберите систему на карте</div>';
                return;
            }

            panel.innerHTML = `
                <h2>${selected.name}</h2>
                <div class="owner" style="color:${selected.factionColor}">
                    ${selected.factionName}
                    ${selected.onFire ? ' &nbsp;🔥' : ''}
                </div>

                <div class="section-title">Владелец</div>
                <div class="faction-btns">
                    ${Object.entries(FACTIONS).map(([id, f]) => `
                        <button class="faction-btn${selected.faction === id ? ' active' : ''}"
                                data-faction="${id}">
                            <div class="faction-dot" style="background:${f.color}"></div>
                            ${f.name}
                        </button>
                    `).join('')}
                </div>

                <div class="section-title">Сражение</div>
                <button class="battle-btn ${selected.onFire ? 'on' : 'off'}" id="battle-toggle">
                    ${selected.onFire ? '🔥 Сражение идёт — выключить' : '⚔️ Включить сражение'}
                </button>
            `;

            panel.querySelectorAll('.faction-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const faction = btn.dataset.faction;
                    await updatePlanet(selected.name, { faction });
                    selected = planets.find(p => p.name === selected.name);
                    renderPlanets();
                    renderLinks();
                    renderPanel();
                });
            });

            document.getElementById('battle-toggle').addEventListener('click', async () => {
                const newVal = !selected.onFire;
                await updatePlanet(selected.name, { onFire: newVal });
                selected = planets.find(p => p.name === selected.name);
                renderPlanets();
                renderPanel();
            });
        }

        async function init() {
            renderLegend();
            await loadState();
            renderPlanets();
            renderLinks();

            document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);
            document.addEventListener('fullscreenchange', () => {
                updateFullscreenBtn();
                setTimeout(onMapResize, 50);
            });
            window.addEventListener('resize', onMapResize);
        }

        init();
    </script>
</body>
</html>
